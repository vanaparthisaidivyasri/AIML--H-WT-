<!DOCTYPE html>
<html lang="en">
<head>
    <title>Course</title>
</head>
<body>
    <h1>Course Registration Form</h1>
    <form>
        <fieldset>
            <legend>Personal Details</legend>
<table>
                <tr>
                   <td><label>First Name</label> </td>
                   <td><input type="text" name="fn" size="16" placeholder="Ex:sai divya sri" required> </td>
                </tr>
                <tr>
                   <td><label>Surname</label></td>
                   <td><input type="text" name="sn" size="16" placeholder="Ex:vanaparthi" required></td>
                </tr>
                <tr>
                    <td><label>Mobile Number</label></td>
                    <td><input type="tel" name="mn" size="16" placeholder="Ex:999-555-6666" required></td>
                </tr>
                <tr>
                    <td><label>Email</label></td>
                    <td><input type="email" name="email" size="16" placeholder="Ex:saidivyasri@gmail.com" required></td>
                </tr>
                <tr>
                    <td><label>Password</label></td>
                    <td><input type="password" name="password" size="16" required></td>
                </tr>
                <tr>
                    <td><label>Confirm Password</label></td>
                    <td><input type="password" name="cp" size="16" required></td>
                </tr>
                <tr>
                    <td><label>DOB</label></td>
                    <td><input type="date" name="dob" required></td>
                </tr>
 </table> 
            <label>Gender</label>
            <input type="radio" name="gender" value="M">Male
            <input type="radio" name="gender" value="F">Female
            <input type="radio" name="gender" value="O">Others<br>
            <label>Select Country</label>
            <select>
                <option>INDIA</option>
                <option>USA</option>
         </select> <br>
         <label>Upload Picture</label>
         <input type="file" name="file"><br>
         <input type="reset"> <br>
         <input type="submit">    
        </fieldset>
     </form> 
     <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d243646.9050982321!2d78.24323297235844!3d17.412608640684784!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb99daeaebd2c7%3A0xae93b78392bafbc2!2sHyderabad%2C%20Telangana!5e0!3m2!1sen!2sin!4v1788755658803!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe> <br>
     
     <label>Comments</label><br>
     <textarea name="" placeholder="Write your Comments" rows="6" cols="40"></textarea>
</body>
</html>
